<!DOCTYPE html>
<html th:replace="~{layout/masterLayout :: layout(~{::main})}" 
	xmlns:th="http://www.thymeleaf.org">

<body>
<main role="main">
	<div class="container">
		<h1 class="lead" th:classappend="${error} ? 'text-danger':''">Order Id <span th:text="${orderId}"></span></h1>
		<h1 class="lead" th:classappend="${error} ? 'text-danger':''">Order Status <span th:text="${orderStatus}"></span></h1>
	</div>
	
</main>
</body>
</html>
